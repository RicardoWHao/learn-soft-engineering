<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 节点：x, w, 主题色, 图标, 标题, 副标题, 标签 -->
  <!-- 1 GitHub 仓库 -->
  <g>
    <rect x="30" y="150" width="190" height="150" rx="14" fill="#172554" stroke="#1e40af" stroke-width="2"/>
    <circle cx="62" cy="188" r="16" fill="#2563eb"/>
    <path d="M55 193 v-7 a7 7 0 0 1 14 0 v7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="125" y="194" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">GitHub 仓库</text>
    <text x="125" y="222" text-anchor="middle" font-size="13" fill="#94a3b8">数据源（无数据库）</text>
    <text x="125" y="246" text-anchor="middle" font-size="13" fill="#cbd5e1">docs/**/*.md</text>
    <text x="125" y="270" text-anchor="middle" font-size="12" fill="#64748b">内容即文件，Git 管版本</text>
  </g>

  <!-- 2 GitHub Actions -->
  <g>
    <rect x="280" y="150" width="190" height="150" rx="14" fill="#451a03" stroke="#92400e" stroke-width="2"/>
    <circle cx="312" cy="188" r="16" fill="#d97706"/>
    <path d="M307 180 l5 4 5 -4 M312 184 v6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="375" y="194" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">GitHub Actions</text>
    <text x="375" y="222" text-anchor="middle" font-size="13" fill="#94a3b8">CI 构建（临时虚拟机）</text>
    <text x="375" y="246" text-anchor="middle" font-size="13" fill="#cbd5e1">npm ci · build</text>
    <text x="375" y="270" text-anchor="middle" font-size="12" fill="#64748b">Markdown → HTML/CSS/JS</text>
  </g>

  <!-- 3 GitHub Pages -->
  <g>
    <rect x="530" y="150" width="190" height="150" rx="14" fill="#022c22" stroke="#065f46" stroke-width="2"/>
    <circle cx="562" cy="188" r="16" fill="#059669"/>
    <path d="M555 188 a7 7 0 0 1 14 0 M553 188 h18 M562 181 a10 10 0 0 1 0 14 a10 10 0 0 1 0 -14" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="625" y="194" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">GitHub Pages</text>
    <text x="625" y="222" text-anchor="middle" font-size="13" fill="#94a3b8">静态托管 + 全球 CDN</text>
    <text x="625" y="246" text-anchor="middle" font-size="13" fill="#cbd5e1">dist/ 静态文件</text>
    <text x="625" y="270" text-anchor="middle" font-size="12" fill="#64748b">只发文件，不跑后端</text>
  </g>

  <!-- 4 用户浏览器 -->
  <g>
    <rect x="780" y="150" width="170" height="150" rx="14" fill="#2e1065" stroke="#5b21b6" stroke-width="2"/>
    <circle cx="812" cy="188" r="16" fill="#7c3aed"/>
    <rect x="806" y="182" width="12" height="12" rx="2" stroke="#fff" stroke-width="1.8" fill="none"/>
    <path d="M820 190 h4 M806 196 h18" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="865" y="194" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">用户浏览器</text>
    <text x="865" y="222" text-anchor="middle" font-size="13" fill="#94a3b8">访问公网网址</text>
    <text x="865" y="246" text-anchor="middle" font-size="13" fill="#cbd5e1">下载 HTML/JS</text>
    <text x="865" y="270" text-anchor="middle" font-size="12" fill="#64748b">水合后可交互</text>
  </g>

  <!-- 箭头 1→2 -->
  <line x1="220" y1="225" x2="274" y2="225" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="197" y="106" width="100" height="22" rx="11" fill="#334155"/>
  <text x="247" y="121" text-anchor="middle" font-size="12" fill="#cbd5e1">① push 触发</text>

  <!-- 箭头 2→3 -->
  <line x1="470" y1="225" x2="524" y2="225" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="447" y="106" width="100" height="22" rx="11" fill="#334155"/>
  <text x="497" y="121" text-anchor="middle" font-size="12" fill="#cbd5e1">② 部署产物</text>

  <!-- 箭头 3→4（请求/响应，双向）-->
  <line x1="720" y1="215" x2="774" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="774" y1="238" x2="720" y2="238" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="693" y="106" width="108" height="22" rx="11" fill="#334155"/>
  <text x="747" y="121" text-anchor="middle" font-size="12" fill="#cbd5e1">③ HTTPS 请求</text>
  <text x="747" y="310" text-anchor="middle" font-size="12" fill="#64748b">④ 返回静态文件</text>

  <!-- 底部时间轴说明 -->
  <text x="490" y="380" text-anchor="middle" font-size="14" fill="#94a3b8">
    构建期（push 后约 30~60 秒，执行一次）：仓库 → Actions 构建 → Pages
  </text>
  <text x="490" y="410" text-anchor="middle" font-size="14" fill="#94a3b8">
    访问期（每次访客打开页面）：浏览器 ⇄ Pages CDN，直接取文件，无服务器计算
  </text>
  <text x="490" y="445" text-anchor="middle" font-size="12.5" fill="#64748b">
    数据流单向：Markdown 源码 → 构建产物 → CDN → 浏览器；访客接触不到源码
  </text>
</svg>